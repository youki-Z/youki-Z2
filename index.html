<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>今日のおみくじ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>今日のおみくじ</h1>
            <p>あなたの今日の運勢を占ってみよう！</p>
        </header>

        <main>

            <!-- おみくじ -->
            <section class="card fortune-section">

                <h2>おみくじ</h2>

                <div id="fortuneBox" class="fortune-box">
                    <span id="fortuneText">？？？</span>
                </div>

                <button id="fortuneButton">
                    おみくじを引く
                </button>

                <!-- 結果 -->
                <div id="fortuneResult" class="fortune-result">

                    <p>
                        運勢：
                        <strong id="fortuneName">---</strong>
                    </p>

                    <p>
                        ラッキーカラー：
                        <strong id="luckyColor">---</strong>
                    </p>

                    <p>
                        ラッキーアイテム：
                        <strong id="luckyItem">---</strong>
                    </p>

                    <p id="fortuneComment">
                        おみくじを引いてみましょう！
                    </p>

                </div>

            </section>


            <!-- おすすめ動画 -->
            <section
                id="videoSection"
                class="card video-section hidden">

                <h2>あなたへのおすすめ動画</h2>

                <p id="videoDescription">
                    今日の運勢に合わせた動画です。
                </p>

                <div class="video-container">

                    <iframe
                        id="youtubeVideo"
                        src=""
                        title="おすすめ動画"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowfullscreen>
                    </iframe>

                </div>

                <p id="videoTitle"></p>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
